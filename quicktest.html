<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiểm tra nhanh 20 câu – Tin học 12</title><style>
:root{--bg:#070a12;--text:#edf3ff;--muted:#9aa9bf;--line:#263247;--accent:#7c9cff;--green:#2dd47a;--red:#ff6678}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 15%,rgba(124,156,255,.11),transparent 28%),radial-gradient(circle at 85% 25%,rgba(143,124,255,.08),transparent 30%),#070a12;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);opacity:.2;pointer-events:none}
body:before{width:320px;height:320px;background:#526fff;left:-120px;top:18%;animation:float1 20s ease-in-out infinite alternate}
body:after{width:280px;height:280px;background:#8a5cff;right:-100px;bottom:8%;animation:float2 24s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(75px,45px)}}@keyframes float2{to{transform:translate(-65px,-55px)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ── SCREEN: START ── */
#screen-start{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 18px;text-align:center;animation:fade .9s ease both}
.badge{display:inline-flex;padding:7px 14px;border:1px solid rgba(124,156,255,.28);border-radius:999px;color:#b7c5ff;background:rgba(124,156,255,.07);font-size:13px;font-weight:800;margin-bottom:20px}
#screen-start h1{font-size:clamp(30px,6vw,56px);margin:0 0 12px;letter-spacing:-1.5px;background:linear-gradient(90deg,#fff,#aebcff,#d0c8ff,#fff);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 10s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:0% center}50%{background-position:100% center}}
#screen-start p{color:var(--muted);line-height:1.75;font-size:15px;max-width:520px;margin:0 auto 32px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:400px;width:100%;margin-bottom:36px}
.info-box{background:rgba(20,29,47,.9);border:1px solid rgba(135,156,200,.16);border-radius:14px;padding:16px 10px;text-align:center}
.info-box .val{font-size:26px;font-weight:800;color:var(--accent)}
.info-box .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.btn-start{border:1px solid rgba(124,156,255,.28);border-radius:14px;padding:16px 38px;font-size:17px;font-weight:800;cursor:pointer;color:white;background:linear-gradient(135deg,#607cff,#8269f0);box-shadow:0 8px 28px rgba(80,92,210,.28);transition:transform .4s ease,box-shadow .4s ease,filter .4s ease;text-decoration:none}
.btn-start:hover{transform:translateY(-3px);filter:brightness(1.1);box-shadow:0 14px 36px rgba(80,92,210,.38)}

/* ── SCREEN: QUIZ ── */
#screen-quiz{display:none;max-width:860px;margin:0 auto;padding:20px 18px 120px}

/* timer bar */
#timerbar-wrap{position:sticky;top:0;z-index:10;padding:10px 0 6px;background:linear-gradient(to bottom,#070a12 80%,transparent)}
.timerbar-inner{display:flex;align-items:center;gap:12px}
#timer-display{font-size:22px;font-weight:800;color:var(--accent);min-width:54px;font-variant-numeric:tabular-nums;transition:color .3s}
#timer-display.warn{color:#ffb347}
#timer-display.danger{color:var(--red);animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.5}}
.bar-bg{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
#bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#607cff,#8269f0);transition:width .5s linear,background .5s}
#bar-fill.warn{background:linear-gradient(90deg,#ffb347,#ff8c00)}
#bar-fill.danger{background:linear-gradient(90deg,var(--red),#ff3355)}
#prog-label{font-size:13px;color:var(--muted);min-width:44px;text-align:right}

/* quiz heading */
.quiz-heading{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.quiz-heading h1{font-size:clamp(20px,3.5vw,30px);margin:0;letter-spacing:-.5px}
.score-live{font-size:14px;color:var(--muted)}

/* cards */
.card{background:linear-gradient(145deg,rgba(20,29,47,.93),rgba(12,17,29,.9));border:1px solid rgba(135,156,200,.16);border-radius:18px;padding:18px 20px;margin:14px 0;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:cardIn .6s ease both;transition:border-color .5s}
.card:hover{border-color:rgba(124,156,255,.28)}
.topic{font-size:12px;font-weight:800;color:#a9baff;margin-bottom:7px;letter-spacing:.3px}
.q{font-weight:650;margin-bottom:12px;line-height:1.6}
label{display:block;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin:7px 0;cursor:pointer;color:#dce5f5;background:rgba(255,255,255,.018);transition:background .3s,border-color .3s,transform .25s}
label:hover{background:rgba(124,156,255,.075);border-color:#3b4f74;transform:translateX(2px)}
input[type=radio]{margin-right:9px;accent-color:var(--accent)}
.correct{border-color:rgba(45,212,122,.7)!important;background:rgba(45,212,122,.1)!important}
.wrong{border-color:rgba(255,102,120,.7)!important;background:rgba(255,102,120,.1)!important}

/* sticky submit */
#submit-wrap{position:sticky;bottom:16px;z-index:5;text-align:center;pointer-events:none}
#btnSubmit{pointer-events:auto;border:1px solid rgba(124,156,255,.28);border-radius:13px;padding:14px 32px;font-size:15px;font-weight:800;cursor:pointer;color:white;background:linear-gradient(135deg,#607cff,#8269f0);box-shadow:0 8px 28px rgba(80,92,210,.28);transition:transform .4s,box-shadow .4s,filter .4s}
#btnSubmit:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 12px 34px rgba(80,92,210,.36)}

/* result */
#result{display:none;background:rgba(10,18,36,.97);border:1px solid var(--line);border-radius:18px;padding:22px;margin:20px 0}
.result-score{font-size:clamp(36px,7vw,64px);font-weight:900;background:linear-gradient(90deg,#607cff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-sub{color:var(--muted);margin:6px 0 18px;line-height:1.65}
.btn-retry{border:1px solid rgba(124,156,255,.28);border-radius:13px;padding:13px 28px;font-size:15px;font-weight:800;cursor:pointer;color:white;background:linear-gradient(135deg,#607cff,#8269f0);box-shadow:0 8px 28px rgba(80,92,210,.22);transition:transform .4s,box-shadow .4s,filter .4s;margin-right:10px}
.btn-retry:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn-home{border:1px solid rgba(135,156,200,.25);border-radius:13px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer;color:var(--muted);background:transparent;transition:border-color .3s,color .3s}
.btn-home:hover{border-color:rgba(124,156,255,.4);color:#dce5f5}
@media(max-width:600px){.info-grid{grid-template-columns:repeat(3,1fr)}.btn-home{margin-top:10px}}
</style></head>

const TOTAL_SEC = 600;
const PER_BAI = 5;
const SCORE_PER_Q = 0.5;

let qs=[], answered=0, timerInterval=null, secondsLeft=TOTAL_SEC, submitted=false;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function pickQuestions(){
  const picked=[];
  [1,2,3,4].forEach(bai=>{
    const pool=shuffle(POOL[String(bai)]);
    picked.push(...pool.slice(0,PER_BAI));
  });
  return shuffle(picked);
}

function formatTime(s){
  const m=Math.floor(s/60), sec=s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

function updateTimer(){
  const el=document.getElementById('timer-display');
  const bar=document.getElementById('bar-fill');
  const pct=(secondsLeft/TOTAL_SEC)*100;
  el.textContent=formatTime(secondsLeft);
  bar.style.width=pct+'%';
  el.className='';bar.className='';
  if(pct<=25){el.classList.add('danger');bar.classList.add('danger');}
  else if(pct<=50){el.classList.add('warn');bar.classList.add('warn');}
}

function startTimer(){
  updateTimer();
  timerInterval=setInterval(()=>{
    secondsLeft--;
    updateTimer();
    if(secondsLeft<=0){clearInterval(timerInterval);autoSubmit();}
  },1000);
}

function countAnswered(){
  let n=0;
  qs.forEach((_,i)=>{if(document.querySelector('input[name="q'+i+'"]:checked'))n++;});
  return n;
}

function buildQuiz(){
  const form=document.getElementById('quiz');
  form.innerHTML='';
  qs.forEach((x,i)=>{
    const d=document.createElement('div');
    d.className='card';d.id='c'+i;
    d.style.animationDelay=(Math.min(i,10)*35)+'ms';
    d.innerHTML='<div class="topic">'+(i+1)+'. '+x.topic+'</div>'
      +'<div class="q">'+x.q+'</div>'
      +x.opts.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'">'+String.fromCharCode(65+j)+'. '+o+'</label>').join('');
    form.appendChild(d);

    d.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('change',()=>{
        const n=countAnswered();
        document.getElementById('score-live').textContent=n+' / 20 câu đã chọn';
        document.getElementById('prog-label').textContent=n+'/20';
      });
    });
  });
}

function doSubmit(){
  if(submitted)return;
  submitted=true;
  clearInterval(timerInterval);
  document.getElementById('btnSubmit').style.display='none';

  let score=0;
  qs.forEach((x,i)=>{
    const sel=document.querySelector('input[name="q'+i+'"]:checked');
    const card=document.getElementById('c'+i);
    card.querySelectorAll('label').forEach((lab,j)=>{
      lab.classList.remove('correct','wrong');
      if(j===x.a) lab.classList.add('correct');
    });
    card.querySelectorAll('input').forEach(inp=>inp.disabled=true);
    if(sel){
      if(+sel.value===x.a) score+=SCORE_PER_Q;
      else card.querySelectorAll('label')[+sel.value].classList.add('wrong');
    }
  });

  const total=qs.length*SCORE_PER_Q;
  const res=document.getElementById('result');
  res.style.display='block';
  document.getElementById('res-score').textContent=score.toFixed(1)+' / '+total.toFixed(1);
  const pct=Math.round(score/total*100);
  const ok=countAnswered();
  let msg='Đã trả lời: '+ok+'/20 câu.';
  if(pct>=80) msg+=' 🎉 Xuất sắc!';
  else if(pct>=60) msg+=' 👍 Khá tốt!';
  else msg+=' 💪 Cần ôn thêm nhé!';
  document.getElementById('res-sub').innerHTML=msg+'<br><span style="font-size:13px;color:var(--muted)">Đáp án đúng đã được đánh dấu xanh. Bạn có thể làm lại để luyện tập thêm.</span>';
  res.scrollIntoView({behavior:'smooth',block:'start'});
}

function autoSubmit(){
  if(!submitted) doSubmit();
}

function startQuiz(){
  submitted=false; answered=0; secondsLeft=TOTAL_SEC;
  qs=pickQuestions();
  buildQuiz();
  document.getElementById('result').style.display='none';
  document.getElementById('btnSubmit').style.display='';
  document.getElementById('score-live').textContent='0 / 20 câu đã chọn';
  document.getElementById('prog-label').textContent='0/20';
  document.getElementById('screen-start').style.display='none';
  document.getElementById('screen-quiz').style.display='block';
  window.scrollTo({top:0});
  startTimer();
}

document.getElementById('btnStart').addEventListener('click',startQuiz);
document.getElementById('btnSubmit').addEventListener('click',doSubmit);
document.getElementById('btnRetry').addEventListener('click',()=>{
  clearInterval(timerInterval);
  startQuiz();
});
document.getElementById('btnHome').addEventListener('click',()=>{
  clearInterval(timerInterval);
  window.location.href='index.html';
});
</script>
</body></html>
