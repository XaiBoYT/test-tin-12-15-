const form=document.getElementById('quiz');
qs.forEach((x,i)=>{
 const d=document.createElement('div'); d.className='card'; d.id='c'+i;
 d.innerHTML='<div class="topic">'+(i+1)+'. '+x.topic+'</div><div class="q">'+x.q+'</div>'+
 x.opts.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'">'+String.fromCharCode(65+j)+'. '+o+'</label>').join('');
 form.appendChild(d);
});
document.getElementById('submit').onclick=()=>{
 let score=0, answered=0;
 qs.forEach((x,i)=>{
   const sel=document.querySelector('input[name="q'+i+'"]:checked');
   const card=document.getElementById('c'+i);
   card.querySelectorAll('label').forEach((lab,j)=>{
     lab.classList.remove('correct','wrong');
     if(j===x.a) lab.classList.add('correct');
   });
   if(sel){answered++; if(+sel.value===x.a) score++; else card.querySelectorAll('label')[+sel.value].classList.add('wrong');}
 });
 const pct=Math.round(score/qs.length*100);
 const r=document.getElementById('result'); r.style.display='block';
 r.innerHTML='<h2>Kết quả: '+score+'/80 ('+pct+'%)</h2><div>Đã trả lời: '+answered+'/80 câu.</div><div class="small">Đáp án đúng đã được đánh dấu. Có thể sửa đáp án rồi nộp lại.</div>';
 window.scrollTo({top:0,behavior:'smooth'});
};
