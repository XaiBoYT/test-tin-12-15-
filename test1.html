if(sel){answered++;if(+sel.value===x.a)score++;else card.querySelectorAll('label')[+sel.value].classList.add('wrong');}});
const r=document.getElementById('result');r.style.display='block';r.innerHTML='<h2>Kết quả: '+score+'/80 ('+Math.round(score/qs.length*100)+'%)</h2><div>Đã trả lời: '+answered+'/80 câu.</div><div class="small">Đáp án đúng đã được đánh dấu; bạn có thể sửa đáp án rồi nộp lại.</div>';window.scrollTo({top:0,behavior:'smooth'});};
</script></body></html>
